schema_version: "1.1"
name: new-idea-non-technical
expected_outcome: |
  Groundcrew starts Intake for a new build: it creates the .groundcrew folder (project file, gates file, gate check) and the AGENTS.md block, identifies the owner as non-technical, and moves into Product by asking one plain-language question with a recommendation. It does not dump code or a wall of questions, and flags payments as a risk category.
